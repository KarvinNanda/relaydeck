name: ci

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  # The Vue UI: lint, unit tests, type check and build, then a Go build that
  # embeds the built UI. The go job below does not need Node: without a
  # build, internal/webui/dist holds only .gitkeep and the binary still builds.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test # eslint (vue/no-v-html is an error), then vitest
      - run: npm run build # vue-tsc, vite build into internal/webui/dist, check-dist
      - run: node scripts/check-mermaid.mjs # every Mermaid block in docs/architecture.md must parse
        working-directory: .
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/relaydeck
        working-directory: .

  go:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run on Linux and Windows only: hosted macOS runners are scarce and
        # often queue for a long time. macOS runs on every push to development and main.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/relaydeck
